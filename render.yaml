# Render Blueprint — free alternative to Replit.
# Dashboard → New → Blueprint → pick this repo. Every push to main redeploys.
services:
  - type: web
    name: attn
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      - key: ANTHROPIC_API_KEY   # set in the Render dashboard (Environment tab); never in git
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ASSISTANT_NAME
        value: Andrew
