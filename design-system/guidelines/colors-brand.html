<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-action);color:var(--fg-1)}.sw{display:flex;flex-wrap:wrap;gap:12px}.s{width:90px}.s i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.s b{display:block;font:600 11px var(--font-action);margin-top:6px}.s code,code{font:400 10px ui-monospace,Menlo,monospace;color:var(--fg-3);display:block}</style></head><body><div class="sw"><div class="s"><i style="background:var(--attn-sky)"></i><b>Sky</b><code>--attn-sky</code></div><div class="s"><i style="background:var(--attn-sky-soft)"></i><b>Sky soft</b><code>--attn-sky-soft</code></div><div class="s"><i style="background:var(--attn-cream)"></i><b>Cream</b><code>--attn-cream</code></div><div class="s"><i style="background:var(--attn-sun)"></i><b>Sun</b><code>--attn-sun</code></div><div class="s"><i style="background:var(--attn-mint)"></i><b>Mint</b><code>--attn-mint</code></div><div class="s"><i style="background:var(--attn-action)"></i><b>Action blue</b><code>--attn-action</code></div><div class="s"><i style="background:var(--attn-ink)"></i><b>Ink</b><code>--attn-ink</code></div></div></body></html>
