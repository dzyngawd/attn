<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-action);color:var(--fg-1)}.sw{display:flex;flex-wrap:wrap;gap:12px}.s{width:90px}.s i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.s b{display:block;font:600 11px var(--font-action);margin-top:6px}.s code,code{font:400 10px ui-monospace,Menlo,monospace;color:var(--fg-3);display:block}</style></head><body><div class="sw"><div class="s"><i style="background:var(--attention-immediate)"></i><b>immediate</b><code>--attention-immediate</code></div><div class="s"><i style="background:var(--attention-upcoming)"></i><b>upcoming</b><code>--attention-upcoming</code></div><div class="s"><i style="background:var(--attention-prepare)"></i><b>prepare</b><code>--attention-prepare</code></div><div class="s"><i style="background:var(--attention-resolved)"></i><b>resolved</b><code>--attention-resolved</code></div><div class="s"><i style="background:var(--status-action-needed)"></i><b>action-needed</b><code>--status-action-needed</code></div></div></body></html>
