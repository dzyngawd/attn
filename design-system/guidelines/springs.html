<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-action);color:var(--fg-1)}.sw{display:flex;flex-wrap:wrap;gap:12px}.s{width:90px}.s i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.s b{display:block;font:600 11px var(--font-action);margin-top:6px}.s code,code{font:400 10px ui-monospace,Menlo,monospace;color:var(--fg-3);display:block}</style></head><body><style>@keyframes p{0%,40%{transform:scale(.6)}100%{transform:scale(1)}}</style><div style="display:flex;gap:18px"><div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:center;justify-content:center"><i style="display:block;width:60px;height:60px;border-radius:20px;background:var(--attn-sun);animation:p 1400ms var(--ease-selection) infinite alternate"></i></div><code>spring/selection-bounce · 0.04</code></div><div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:center;justify-content:center"><i style="display:block;width:60px;height:60px;border-radius:20px;background:var(--attn-sun);animation:p 1400ms var(--ease-content) infinite alternate"></i></div><code>spring/content-bounce · 0.08</code></div><div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:center;justify-content:center"><i style="display:block;width:60px;height:60px;border-radius:20px;background:var(--attn-sun);animation:p 1400ms var(--ease-expressive) infinite alternate"></i></div><code>spring/expressive-bounce · 0.22</code></div></div><div style="margin-top:14px;font:400 12px/1.5 var(--font-action);color:var(--fg-2)">Haptics: <b>selection</b> · <b>impactLight</b> · <b>success</b>. No haptics on ambient loops, percentage ticks, card entrances or automatic background updates.</div></body></html>
