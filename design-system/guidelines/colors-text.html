<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-action);color:var(--fg-1)}.sw{display:flex;flex-wrap:wrap;gap:12px}.s{width:90px}.s i{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.s b{display:block;font:600 11px var(--font-action);margin-top:6px}.s code,code{font:400 10px ui-monospace,Menlo,monospace;color:var(--fg-3);display:block}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="display:flex;flex-direction:column;gap:6px"><div style="font:600 15px var(--font-brand);color:var(--text-primary)">text/primary <code style="display:inline">--text-primary</code></div><div style="font:600 15px var(--font-brand);color:var(--text-secondary)">text/secondary <code style="display:inline">--text-secondary</code></div><div style="font:600 15px var(--font-brand);color:var(--text-tertiary)">text/tertiary <code style="display:inline">--text-tertiary</code></div><div style="font:600 15px var(--font-brand);color:var(--text-quaternary)">text/quaternary <code style="display:inline">--text-quaternary</code></div><div style="font:600 15px var(--font-brand);color:var(--text-subtle)">text/subtle <code style="display:inline">--text-subtle</code></div></div><div style="background:var(--surface-priority);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px"><div style="font:600 15px var(--font-brand);color:var(--text-on-dark)">text/on-dark</div><div style="font:600 15px var(--font-brand);color:var(--text-on-dark-secondary)">text/on-dark-secondary</div><div style="font:600 15px var(--font-brand);color:var(--text-on-dark-tertiary)">text/on-dark-tertiary</div><div style="font:600 15px var(--font-brand);color:var(--status-action-needed)">status/action-needed</div></div></div></body></html>
